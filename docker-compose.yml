name: brightloop

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brightloop -d brightloop']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  postgres_data:
